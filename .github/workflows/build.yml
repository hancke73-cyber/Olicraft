name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konfigurieren
        run: cmake -S . -B build -DOLICRAFT_BUILD_TESTS=ON
      - name: Bauen
        run: cmake --build build --config Release
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: OliCraft-windows
          path: build/Release/OliCraft.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: sudo apt-get update && sudo apt-get install -y libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev
      - name: Konfigurieren
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOLICRAFT_BUILD_TESTS=ON
      - name: Bauen
        run: cmake --build build -j
      - name: Tests
        run: ctest --test-dir build --output-on-failure
